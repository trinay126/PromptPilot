name: Test and release PromptPilot

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint with ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install ruff

      - name: Run ruff
        run: ruff check src tests

      - name: Lint the workflow files
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sSL --retry 3 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint .github/workflows/*.yml

  test:
    name: Test ${{ matrix.os }} on Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit and mocked HTTP tests
        run: |
          python -m pytest --cov=promptpilot --cov-report=term-missing 2>&1 | tee pytest-output.txt
          exit ${PIPESTATUS[0]}

      - name: Publish the failing test output
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-diagnostics
          git add -f pytest-output.txt
          git commit -m "ci diagnostics ${{ matrix.os }} ${{ matrix.python-version }}"
          git push --force origin ci-diagnostics

      - name: Verify CLI contract
        run: python -m promptpilot --help

      - name: Verify the CLI version flag
        run: python -m promptpilot --version

  build-linux:
    name: Build Linux bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build versioned release bundle
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ./scripts/build_linux.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: promptpilot-${{ github.ref_name }}-linux-x64
          path: artifacts/*

  build-windows:
    name: Build Windows bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build versioned release bundle
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: .\scripts\build_windows.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: promptpilot-${{ github.ref_name }}-windows-x64
          path: artifacts/*

  build-sdist:
    name: Build Python source distribution
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --sdist --wheel --outdir dist

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: promptpilot-${{ github.ref_name }}-python
          path: dist/*

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect the release assets
        id: assets
        run: |
          set -euo pipefail
          find artifacts -type f | sort | tee assets.txt
          echo "count=$(wc -l < assets.txt)" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          ## Installing PromptPilot ${VERSION}

          ### Linux — standalone binary, no Python needed

          ```bash
          curl -LO "https://github.com/trinay126/PromptPilot/releases/download/${VERSION}/promptpilot-${VERSION}-linux-x64.tar.gz"
          tar -xzf "promptpilot-${VERSION}-linux-x64.tar.gz"
          sudo install -m 0755 "promptpilot-${VERSION}-linux-x64/promptpilot" /usr/local/bin/promptpilot
          promptpilot --version
          ```

          ### Linux — with pipx (recommended)

          ```bash
          pipx install promptpilot
          ```

          ### Windows — standalone executable

          Download `promptpilot-${VERSION}-windows-x64.zip`, extract it, and run
          `promptpilot.exe`. Add the folder to your `PATH` to use it from anywhere.

          ### Any platform — Python package

          ```bash
          pip install promptpilot
          ```

          ### Verify the download

          Each bundle ships a `SHA256SUMS.txt` file:

          ```bash
          sha256sum -c SHA256SUMS.txt
          ```
          NOTES

      - name: Publish the release
        id: publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -o pipefail
          {
            mapfile -t ASSETS < <(grep -E '\.(tar\.gz|zip|whl)$|SHA256SUMS\.txt$|release-manifest\.json$' assets.txt)
            echo "publishing ${#ASSETS[@]} assets"
            printf '  %s\n' "${ASSETS[@]}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release already exists, uploading with --clobber"
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
              gh release edit "$TAG" --title "PromptPilot $TAG" --notes-file notes.md
            else
              gh release create "$TAG" \
                --title "PromptPilot $TAG" \
                --notes-file notes.md \
                --verify-tag \
                "${ASSETS[@]}"
            fi
            echo "exit=$?"
          } 2>&1 | tee release-output.txt

      - name: Report a failed release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Release output"
            echo
            echo '```'
            cat release-output.txt 2>/dev/null || echo "(nothing captured)"
            echo '```'
            echo
            echo "### Assets found"
            echo
            echo '```'
            cat assets.txt 2>/dev/null || echo "(none)"
            echo '```'
          } > diagnostics.md
          gh issue create \
            --title "Release diagnostics: ${{ github.ref_name }}" \
            --body-file diagnostics.md \
            --label diagnostics 2>&1 | tee -a release-output.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-diagnostics 2>/dev/null || true
          git add -f release-output.txt assets.txt diagnostics.md 2>/dev/null || true
          git commit -m "ci release diagnostics ${{ github.ref_name }}" 2>/dev/null || true
          git push --force origin HEAD:ci-diagnostics 2>&1 | tee -a release-output.txt || true

      - name: Close stale diagnostics issues
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --label diagnostics --limit 20 \
            --json number --jq '.[].number' \
            | while read -r number; do
                gh issue close "$number" --comment "Resolved by a successful release." || true
              done
