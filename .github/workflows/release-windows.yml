name: Test and release PromptPilot for Windows

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit and mocked HTTP tests
        run: python -m pytest --cov=promptpilot --cov-report=term-missing

      - name: Verify CLI contract
        run: python -m promptpilot --help

  release:
    name: Build and publish Windows release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build versioned release bundle
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: .\scripts\build_windows.ps1

      - name: Upload build artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: promptpilot-${{ github.ref_name }}-windows-x64
          path: artifacts/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/promptpilot-${{ github.ref_name }}-windows-x64.zip
            artifacts/promptpilot-${{ github.ref_name }}-windows-x64/SHA256SUMS.txt
            artifacts/promptpilot-${{ github.ref_name }}-windows-x64/release-manifest.json
