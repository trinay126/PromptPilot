[build-system]
requires = ["setuptools>=69]
build-backend = "setuptools.build_meta"

[project]
name = "promptpilot"
version = "1.0.0"
description = "A Groq AI command line workbench for learning and portfolio use"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE"}
authors = [{name = "Chadalavada Trinay Sai"}]
dependencies = [
    "httpx>0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "rich>=13.7,<15.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "respx>=0.21,<1.0",
    "pyinstaller>=6.0,<7.0",
]

[project.scripts]
promptpilot = "promptpilot.cli:main"

[tool.setuptools.package.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-lenght = 100
target-version = "py311"
